[project]
name = "gmeow"
version = "1.0.0"
description = "Local Gmail intelligence server for agents, MCP, and REST automation"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
authors = [
    { name = "Blackcat Informatics® Inc." },
]
keywords = ["gmail", "mcp", "email", "agents", "archive", "semantic-search", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "pydantic>=2.10",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "google-auth-httplib2>=0.2",
    "rustworkx>=0.15",
    "semchunk>=4.0.0",
    "spacy>=3.8.14",
    "scikit-learn>=1.8.0",
    "blake3>=1.0",
    "zstandard>=0.23",
    "tantivy>=0.22",
    "tenacity>=9.1",
    "en-core-web-sm",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/paudley/gmeow"
Repository = "https://github.com/paudley/gmeow"
Issues = "https://github.com/paudley/gmeow/issues"
PyPI = "https://pypi.org/project/gmeow/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmeow"]

[tool.hatch.build.targets.sdist]
only-include = [
    "CODE_OF_CONDUCT.md",
    "gmeow.toml-example",
    "CONTRIBUTING.md",
    "docs",
    "LICENSE",
    "main.py",
    "migrations",
    "pyproject.toml",
    "README.md",
    "scripts",
    "SECURITY.md",
    "src",
    "tests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "coding-ethos", "data", "dist", "vendor"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
