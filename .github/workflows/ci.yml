name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --extra test
      - run: uv run python -m compileall main.py src migrations tests
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/public_release_check.py
