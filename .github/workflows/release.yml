name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  go:
    name: Build Go binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o dist/gmeow ./cmd/gmeow
      - run: go build -o dist/gmeow-admin ./cmd/gmeow-admin
      - run: go build -o dist/gmeow-worker ./cmd/gmeow-worker
      - uses: actions/upload-artifact@v7
        with:
          name: go-binaries
          path: dist/gmeow*

  python-intel:
    name: Build gmeow-intel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: make release-check
      - run: cd python && uv run pytest
      - run: cd python && uv build
      - uses: actions/upload-artifact@v7
        with:
          name: gmeow-intel-dist
          path: python/dist/

  pypi:
    name: Publish gmeow-intel to PyPI
    runs-on: ubuntu-latest
    needs: python-intel
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: gmeow-intel-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
