[project]
name = "gmeow-intel"
version = "0.0.0"
description = "Python analysis workers for Gmeow"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
authors = [
    { name = "Blackcat Informatics Inc." },
]
dependencies = [
    "pydantic>=2.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[project.scripts]
gmeow-intel-worker = "gmeow_intel.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gmeow_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
