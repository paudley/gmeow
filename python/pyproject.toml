[project]
name = "gmeow-intel"
version = "0.0.0"
description = "Python analysis workers for Gmeow"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
authors = [
    { name = "Blackcat Informatics Inc." },
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.10",
    "scikit-learn>=1.8.0",
    "spacy>=3.8.14",
    "en-core-web-sm",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[project.scripts]
gmeow-intel = "gmeow_intel.worker:main"
gmeow-intel-worker = "gmeow_intel.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gmeow_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
