syntax = "proto3";

package gmeow.v1;

option go_package = "blackcat.ca/gmeow/internal/rpc/gen/gmeow/v1;gmeowv1";

import "gmeow/v1/common.proto";

service FilestoreService {
  rpc LookupSourceObject(LookupSourceObjectRequest) returns (LookupSourceObjectResponse);
  rpc TryAcquireSourceIngest(TryAcquireSourceIngestRequest) returns (TryAcquireSourceIngestResponse);
  rpc ReleaseSourceIngest(ReleaseSourceIngestRequest) returns (Empty);
  rpc PutObject(stream PutObjectFrame) returns (PutObjectResponse);
  rpc AttachProvenance(AttachProvenanceRequest) returns (Empty);
  rpc PutCompound(PutCompoundRequest) returns (PutCompoundResponse);
  rpc Open(OpenRequest) returns (stream ObjectChunk);
  rpc ReadManifest(ReadManifestRequest) returns (ReadManifestResponse);
  rpc GetStructure(GetStructureRequest) returns (GetStructureResponse);
  rpc HasAnalysisAnnotation(HasAnalysisAnnotationRequest) returns (HasAnalysisAnnotationResponse);
  rpc WriteAnnotation(WriteAnnotationRequest) returns (Empty);
  rpc WriteOverlays(WriteOverlaysRequest) returns (Empty);
  rpc WriteSourceCursor(WriteSourceCursorRequest) returns (Empty);
  rpc ReadSourceCursor(ReadSourceCursorRequest) returns (ReadSourceCursorResponse);
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  rpc StorageBreakdown(StorageBreakdownRequest) returns (StorageBreakdownResponse);
  rpc ResolvePath(ResolvePathRequest) returns (ResolvePathResponse);
  rpc DeleteObject(DeleteObjectRequest) returns (Empty);
  rpc DeleteImport(DeleteImportRequest) returns (DeleteImportResponse);
  rpc Gc(GcRequest) returns (GcResponse);
  rpc Repack(RepackRequest) returns (RepackResponse);
  rpc TrainDictionary(TrainDictionaryRequest) returns (TrainDictionaryResponse);
  rpc GetProjectionObject(ProjectionObjectRequest) returns (ProjectionObjectResponse);
  rpc WalkProjection(WalkProjectionRequest) returns (stream ProjectionObject);
  rpc WalkChangedProjection(WalkChangedProjectionRequest) returns (stream ProjectionObject);
  rpc WalkSourceCursors(WalkSourceCursorsRequest) returns (stream SourceCursor);
}

message ProjectionObjectRequest { string digest = 1; }
message ProjectionObjectResponse { ProjectionObject object = 1; bool found = 2; }
message WalkProjectionRequest {}
message WalkChangedProjectionRequest { string since = 1; }
message WalkSourceCursorsRequest {}

message LookupSourceObjectRequest { SourceObjectRef ref = 1; }
message LookupSourceObjectResponse { string digest = 1; bool found = 2; }
message TryAcquireSourceIngestRequest { SourceObjectRef ref = 1; }
message TryAcquireSourceIngestResponse { SourceIngestClaim claim = 1; bool acquired = 2; }
message ReleaseSourceIngestRequest { SourceIngestClaim claim = 1; }

message PutObjectFrame {
  oneof frame {
    PutObjectStart start = 1;
    bytes data = 2;
    PutObjectFinish finish = 3;
  }
}

message PutObjectStart {
  string media_type = 1;
  string source_hint = 2;
  repeated string content_roles = 3;
  repeated Facet facets = 4;
  repeated Provenance provenance = 5;
  repeated Relationship relationships = 6;
  // priority_class tags the analysis priority the scheduler should assign to work
  // derived from this object (e.g. fresh_ingest for inbox, background for
  // backfill). Empty lets the scheduler choose by reason.
  string priority_class = 7;
}

message PutObjectFinish {}
message PutObjectResponse { string digest = 1; }

message AttachProvenanceRequest {
  string digest = 1;
  repeated Provenance provenance = 2;
  string priority_class = 3;
}

message PutCompoundRequest {
  string object_id = 1;
  string media_type = 2;
  string source_hint = 3;
  repeated string content_roles = 4;
  repeated Facet facets = 5;
  repeated Provenance provenance = 6;
  repeated Relationship relationships = 7;
  repeated CompoundPart parts = 8;
  string priority_class = 9;
}

message PutCompoundResponse { string digest = 1; }
message OpenRequest { string digest = 1; }
message ObjectChunk { bytes data = 1; }
message ReadManifestRequest { string digest = 1; }
message ReadManifestResponse { Manifest manifest = 1; }
message GetStructureRequest { string digest = 1; }
message GetStructureResponse { Structure structure = 1; }
message HasAnalysisAnnotationRequest {
  string digest = 1;
  string analyzer_name = 2;
  string analyzer_version = 3;
}
message HasAnalysisAnnotationResponse { bool found = 1; }
message WriteAnnotationRequest { Annotation annotation = 1; }
message WriteOverlaysRequest { string digest = 1; bytes overlays_json = 2; }
message WriteSourceCursorRequest { SourceCursor cursor = 1; }
message ReadSourceCursorRequest {
  string source_kind = 1;
  string source_name = 2;
}
message ReadSourceCursorResponse {
  SourceCursor cursor = 1;
  bool found = 2;
}
message VerifyRequest {}
message VerifyFinding {
  string digest = 1;
  string path = 2;
  string code = 3;
  string message = 4;
}
message VerifyResponse {
  string status = 1;
  int32 checked = 2;
  repeated VerifyFinding findings = 3;
}

message StorageBreakdownRequest {
  string digest = 1;
  bool recursive_parts = 2;
}
message StorageBreakdownFile {
  string object_digest = 1;
  string role = 2;
  string path = 3;
  int64 logical_bytes = 4;
  int64 allocated_bytes = 5;
  bool estimated = 6;
  string referenced_by = 7;
  string compound_role = 8;
  int32 compound_order = 9;
  bool recursive_part = 10;
}
message StorageBreakdownResponse {
  string root_digest = 1;
  repeated StorageBreakdownFile files = 2;
  int64 total_allocated_bytes = 3;
  int64 total_logical_bytes = 4;
  bool estimated_allocated = 5;
  int32 file_count = 6;
  int32 referenced_object_count = 7;
  bool recursive_parts = 8;
}

message ResolvePathRequest {
  string path = 1;
  int32 records_limit = 2;
}
message ResolvePathRecovery {
  string digest = 1;
  string object_id = 2;
  string identity_strategy = 3;
  string media_type = 4;
  int64 uncompressed_size = 5;
  int64 compressed_size = 6;
  string uncompressed_blake3 = 7;
  string compressed_blake3 = 8;
  string created_at = 9;
}
message ResolvePathParent {
  string parent_digest = 1;
  string role = 2;
  string updated_at = 3;
}
message ResolvePathRecord {
  SourceObjectRef source_object = 1;
  ResolvePathRecovery recovery = 2;
  repeated ResolvePathParent parents = 3;
  string object_digest = 4;
  string child_digest = 5;
  string updated_at = 6;
}
message ResolvePathManifest {
  repeated string facets = 1;
  repeated Provenance provenance = 2;
  repeated CompoundPart parts = 3;
  string object_digest = 4;
  string object_id = 5;
  string media_type = 6;
  int64 size = 7;
  bool compound = 8;
}
message DeleteObjectRequest { string digest = 1; }

message DeleteImportRequest {
  string source_kind = 1;
  string source_name = 2;
}

message DeleteImportResponse {
  int64 objects_scanned = 1;
  int64 objects_deleted = 2;
  int64 provenance_detached = 3;
}

message GcRequest {}
message GcResponse {
  int32 scanned_chunks = 1;
  int32 swept_chunks = 2;
  int32 retained_chunks = 3;
  int32 swept_recipes = 4;
}

message RepackRequest {}
message RepackResponse {
  int32 packs_scanned = 1;
  int32 packs_repacked = 2;
  int32 packs_removed = 3;
  int32 chunks_moved = 4;
  int64 bytes_before = 5;
  int64 bytes_after = 6;
}

message TrainDictionaryRequest { int32 sample_limit = 1; }
message TrainDictionaryResponse {
  string dictionary_id = 1;
  int64 dictionary_bytes = 2;
  int32 samples = 3;
}

message ResolvePathResponse {
  repeated ResolvePathRecord records = 1;
  SourceObjectRef source_object = 2;
  SourceCursor source_cursor = 3;
  SourceIngestClaim ingest_claim = 4;
  ResolvePathManifest manifest = 5;
  string kind = 6;
  string role = 7;
  string input_path = 8;
  string path = 9;
  string physical_path = 10;
  string object_digest = 11;
  int64 logical_bytes = 12;
  int64 allocated_bytes = 13;
  bool estimated = 14;
  int32 record_count = 15;
  int32 records_limit = 16;
  bool truncated = 17;
}
