syntax = "proto3";

package gmeow.v1;

option go_package = "blackcat.ca/gmeow/internal/rpc/gen/gmeow/v1;gmeowv1";

import "gmeow/v1/common.proto";

service QueryService {
  rpc Project(ProjectRequest) returns (Empty);
  rpc ProjectObject(ProjectObjectRequest) returns (Empty);
  rpc ProjectSourceCursor(ProjectSourceCursorRequest) returns (Empty);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc ObjectBreakdown(ObjectBreakdownRequest) returns (ObjectBreakdownResponse);
  rpc ResolveMailIdentity(MailIdentityResolveRequest) returns (MailIdentityResolveResponse);
  rpc Structure(StructureRequest) returns (StructureResponse);
  rpc Relationships(RelationshipRequest) returns (RelationshipResponse);
  rpc Graph(GraphRequest) returns (GraphResponse);
  rpc AnalysisStatus(AnalysisStatusRequest) returns (AnalysisStatusResponse);
  rpc VectorSearch(VectorSearchRequest) returns (VectorSearchResponse);
  rpc RelatedObjects(RelatedObjectsRequest) returns (RelatedObjectsResponse);
  rpc ContactSearch(ContactSearchRequest) returns (ContactSearchResponse);
  rpc ContactAggregate(ContactAggregateRequest) returns (ContactAggregateResponse);
  rpc ResolveContactIdentity(ContactIdentityResolveRequest) returns (ContactIdentityResolveResponse);
  rpc ContactFacts(ContactFactRequest) returns (ContactFactResponse);
  rpc ContactIdentityDetails(ContactIdentityDetailRequest) returns (ContactIdentityDetailResponse);
  rpc ContactNeighborhood(ContactNeighborhoodRequest) returns (ContactNeighborhoodResponse);
  rpc ContactAnalysisInputs(ContactAnalysisInputRequest) returns (ContactAnalysisInputResponse);
  rpc ContactAnalysisStatus(ContactAnalysisStatusRequest) returns (ContactAnalysisStatusResponse);
  rpc StoreContactEmbedding(ContactEmbeddingUpsert) returns (Empty);
  rpc ContactVectorSearch(ContactVectorSearchRequest) returns (ContactVectorSearchResponse);
  rpc SimilarContacts(SimilarContactsRequest) returns (SimilarContactsResponse);
  rpc ContactMessages(ContactMessageRequest) returns (ContactMessageResponse);
  rpc SourceCursors(SourceCursorRequest) returns (SourceCursorResponse);
  rpc JMAPMailboxes(JMAPMailboxRequest) returns (JMAPMailboxResponse);
  rpc JMAPEmailStates(JMAPEmailStateRequest) returns (JMAPEmailStateResponse);
  rpc JMAPEmailQuery(JMAPEmailQueryRequest) returns (JMAPEmailQueryResponse);
  rpc JMAPThreads(JMAPThreadRequest) returns (JMAPThreadResponse);
  rpc JMAPBlobLookup(JMAPBlobLookupRequest) returns (JMAPBlobLookupResponse);
  rpc UpdateJMAPMailboxCatalog(UpdateJMAPMailboxCatalogRequest) returns (JMAPMailboxResponse);
  rpc JMAPMailboxEmailCounts(JMAPMailboxEmailCountRequest) returns (JMAPMailboxEmailCountResponse);
  rpc UpdateJMAPEmailState(UpdateJMAPEmailStateRequest) returns (JMAPEmailState);
  rpc CreateOrGetOperation(CreateOperationRequest) returns (CreateOrGetOperationResponse);
  rpc AppendOperationProgress(AppendOperationProgressRequest) returns (Empty);
  rpc CompleteOperation(CompleteOperationRequest) returns (Empty);
  rpc FailOperation(FailOperationRequest) returns (Empty);
  rpc GetOperation(OperationLookupRequest) returns (OperationLookupResponse);
  rpc GetOperationByRequestHash(OperationByRequestHashRequest) returns (OperationLookupResponse);
  rpc Rebuild(Empty) returns (Empty);
  rpc ProjectChanged(ProjectChangedRequest) returns (Empty);
  rpc ValidateBearerToken(ValidateBearerTokenRequest) returns (ValidateBearerTokenResponse);
}

message ProjectRequest {
  Manifest manifest = 1;
  repeated Annotation annotations = 2;
}

message ObjectBreakdownRequest {}

message BreakdownCount {
  string label = 1;
  int64 count = 2;
}

message BreakdownSource {
  string source_kind = 1;
  string source_name = 2;
  int64 objects = 3;
}

message ObjectBreakdownResponse {
  int64 total_objects = 1;
  int64 total_size_bytes = 2;
  int64 compound_objects = 3;
  int64 simple_objects = 4;
  int64 objects_with_analysis = 5;
  repeated BreakdownCount by_facet = 6;
  repeated BreakdownSource by_source = 7;
  repeated BreakdownCount by_media_type = 8;
  repeated BreakdownCount by_identity_strategy = 9;
  repeated BreakdownCount by_analyzer = 10;
}

message ProjectObjectRequest { ProjectionObject object = 1; }
message ProjectSourceCursorRequest { SourceCursor cursor = 1; }

message ProvenanceFilter {
  repeated string source_kinds = 1;
  repeated string source_names = 2;
  repeated string external_ids = 3;
}

message RelationshipFilter {
  repeated string types = 1;
  string from = 2;
  string to = 3;
  repeated string roles = 4;
  string any = 5;
}

message SearchRequest {
  int32 schema_version = 1;
  string query = 2;
  repeated string facets = 3;
  ProvenanceFilter provenance = 4;
  RelationshipFilter relationships = 5;
  repeated string compound_roles = 6;
  repeated string analyzer_names = 7;
  repeated string media_types = 8;
  int32 limit = 9;
  int32 offset = 10;
}

message SearchResult {
  string object_digest = 1;
  double score = 2;
  string title = 3;
  string snippet = 4;
  repeated string facets = 5;
  bytes attributes_json = 6;
}

message SearchResponse {
  int32 schema_version = 1;
  repeated SearchResult results = 2;
  int32 total = 3;
}

message MailIdentityResolveRequest {
  string message_id = 1;
  int32 limit = 2;
}

message MailIdentityResolveResponse {
  string message_id = 1;
  repeated string object_digests = 2;
  int32 total = 3;
  int32 limit = 4;
}

message StructureRequest { string digest = 1; }
message StructureResponse { Structure structure = 1; }

message RelationshipRequest {
  int32 schema_version = 1;
  RelationshipFilter filter = 2;
  int32 limit = 3;
}

message RelationshipResponse {
  int32 schema_version = 1;
  repeated Relationship relationships = 2;
}

message GraphRequest {
  int32 schema_version = 1;
  string node = 2;
  string predicate = 3;
  int32 limit = 4;
}

message GraphResponse {
  int32 schema_version = 1;
  repeated GraphFact facts = 2;
}

message AnalysisStatusRequest {
  int32 schema_version = 1;
  repeated string object_digests = 2;
  repeated string analyzer_names = 3;
  repeated AnalyzerSpec analyzers = 4;
  int32 limit = 5;
}

message AnalysisStatus {
  string object_digest = 1;
  string analyzer_name = 2;
  string analyzer_version = 3;
  string status = 4;
  string generated_at = 5;
  bytes data_json = 6;
}

message AnalysisStatusResponse {
  int32 schema_version = 1;
  repeated AnalysisStatus statuses = 2;
}

message VectorSearchRequest {
  int32 schema_version = 1;
  string model = 2;
  int32 dimensions = 3;
  repeated float vector = 4;
  repeated string facets = 5;
  int32 limit = 6;
}

message VectorSearchResult {
  string object_digest = 1;
  string model = 2;
  double distance = 3;
  string embedding_id = 4;
  string kind = 5;
  string source_digest = 6;
  string text_preview = 7;
}

message VectorSearchResponse {
  int32 schema_version = 1;
  repeated VectorSearchResult results = 2;
}

// RelatedObjects finds the objects most similar to a seed object using its
// already-stored embeddings (no query-text embedding needed). It powers a
// "more like this message" surface.
message RelatedObjectsRequest {
  int32 schema_version = 1;
  string digest = 2;
  string facet = 3;
  int32 limit = 4;
}

message RelatedObjectsResponse {
  int32 schema_version = 1;
  string seed_digest = 2;
  repeated VectorSearchResult results = 3;
}

message ContactFact {
  string contact_id = 1;
  string fact_kind = 2;
  string value = 3;
  string predicate = 4;
  string source_digest = 5;
  string statement_hash = 6;
  string valid_from = 7;
  string valid_until = 8;
  bool historical = 9;
}

message ContactAggregateRequest {
  string contact_id = 1;
}

message ContactAggregateResponse {
  int32 schema_version = 1;
  string contact_id = 2;
  string display_name = 3;
  string primary_email = 4;
  string first_seen_at = 5;
  string last_seen_at = 6;
  int32 fact_count = 7;
  int32 message_count = 8;
  int32 participant_count = 9;
  repeated ContactFact facts = 10;
  int32 importance_level = 11;
}

message ContactSearchRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ContactSearchResult {
  string contact_id = 1;
  string display_name = 2;
  string primary_email = 3;
  string first_seen_at = 4;
  string last_seen_at = 5;
  double score = 6;
  int32 fact_count = 7;
  int32 message_count = 8;
  int32 participant_count = 9;
  int32 importance_level = 10;
}

message ContactSearchResponse {
  int32 schema_version = 1;
  repeated ContactSearchResult results = 2;
  int32 total = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ContactIdentityResolveRequest {
  string identity = 1;
}

message ContactIdentityResolveResponse {
  int32 schema_version = 1;
  repeated string contact_ids = 2;
}

message ContactFactRequest {
  repeated string contact_ids = 1;
  repeated string fact_kinds = 2;
  string at = 3;
  string from = 4;
  string until = 5;
  bool current = 6;
  int32 limit = 7;
  int32 offset = 8;
}

message ContactFactResponse {
  int32 schema_version = 1;
  repeated ContactFact facts = 2;
  int32 total = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ContactIdentityDetailRequest {
  repeated string identities = 1;
  repeated string contact_ids = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ContactIdentityDetail {
  string contact_id = 1;
  string matched_token = 2;
  string token = 3;
  string token_hash = 4;
  string statement_hash = 5;
  string source_digest = 6;
  string valid_from = 7;
  string valid_until = 8;
}

message ContactIdentityDetailResponse {
  int32 schema_version = 1;
  repeated ContactIdentityDetail results = 2;
  int32 total = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ContactNeighborhoodRequest {
  string contact_id = 1;
  repeated string fact_kinds = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ContactNeighborhoodResult {
  string contact_id = 1;
  string fact_kind = 2;
  string value = 3;
  string predicate = 4;
  string statement_hash = 5;
  string source_digest = 6;
  string valid_from = 7;
  string valid_until = 8;
}

message ContactNeighborhoodResponse {
  int32 schema_version = 1;
  repeated ContactNeighborhoodResult results = 2;
  int32 total = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ContactAnalysisInputRequest {
  repeated string contact_ids = 1;
  repeated string fact_kinds = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ContactAnalysisInputResult {
  string contact_id = 1;
  string display_name = 2;
  string primary_email = 3;
  string first_seen_at = 4;
  string last_seen_at = 5;
  string input_text = 6;
  int32 fact_count = 7;
  int32 message_count = 8;
  int32 participant_count = 9;
  int32 importance_level = 10;
}

message ContactAnalysisInputResponse {
  int32 schema_version = 1;
  repeated ContactAnalysisInputResult results = 2;
  int32 total = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ContactAnalysisStatusRequest {
  repeated string contact_ids = 1;
  repeated string input_hashes = 2;
  string analyzer_name = 3;
  string analyzer_version = 4;
  string model = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message ContactAnalysisStatusResult {
  string contact_id = 1;
  string analyzer_name = 2;
  string analyzer_version = 3;
  string status = 4;
  string model = 5;
  string input_hash = 6;
  int32 input_bytes = 7;
  string generated_at = 8;
  bytes metadata_json = 9;
}

message ContactAnalysisStatusResponse {
  int32 schema_version = 1;
  repeated ContactAnalysisStatusResult results = 2;
  int32 total = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ContactEmbeddingUpsert {
  string contact_id = 1;
  string analyzer_name = 2;
  string analyzer_version = 3;
  string status = 4;
  string model = 5;
  string input_hash = 6;
  int32 input_bytes = 7;
  string generated_at = 8;
  string text_preview = 9;
  repeated float vector = 10;
  bytes metadata_json = 11;
}

message ContactVectorSearchRequest {
  repeated float vector = 1;
  string model = 2;
  repeated string contact_ids = 3;
  int32 dimensions = 4;
  int32 limit = 5;
}

message ContactVectorSearchResult {
  string contact_id = 1;
  string display_name = 2;
  string primary_email = 3;
  string model = 4;
  string embedding_id = 5;
  string input_hash = 6;
  string text_preview = 7;
  double distance = 8;
  int32 dimensions = 9;
}

message ContactVectorSearchResponse {
  int32 schema_version = 1;
  repeated ContactVectorSearchResult results = 2;
}

message SimilarContactsRequest {
  string contact_id = 1;
  string model = 2;
  int32 limit = 3;
}

message SimilarContactsResponse {
  int32 schema_version = 1;
  repeated ContactVectorSearchResult results = 2;
}

message ContactMessageRequest {
  string contact_id = 1;
  string role = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ContactMessageResult {
  string message_digest = 1;
  string message_time = 2;
  string message_id = 3;
  string message_date = 4;
  string role = 5;
  string token = 6;
  string display_name = 7;
  string raw_value = 8;
}

message ContactMessageResponse {
  int32 schema_version = 1;
  repeated ContactMessageResult results = 2;
  int32 total = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message SourceCursorRequest {
  int32 schema_version = 1;
  repeated string source_kinds = 2;
  repeated string source_names = 3;
  int32 limit = 4;
}

message SourceCursorResponse {
  int32 schema_version = 1;
  repeated SourceCursor cursors = 2;
}

message JMAPMailboxRequest {}

message JMAPMailbox {
  string mailbox_id = 1;
  string name = 2;
  string role = 3;
  string parent_id = 4;
  int32 sort_order = 5;
  bool is_system = 6;
  bool is_destroyed = 7;
  string created_at = 8;
  string updated_at = 9;
}

message JMAPMailboxResponse {
  repeated JMAPMailbox mailboxes = 1;
}

message UpdateJMAPMailboxCatalogRequest {
  repeated JMAPMailbox mailboxes = 1;
}

message JMAPMailboxEmailCountRequest {
  repeated string mailbox_ids = 1;
}

message JMAPMailboxEmailCount {
  string mailbox_id = 1;
  int64 email_count = 2;
}

message JMAPMailboxEmailCountResponse {
  repeated JMAPMailboxEmailCount counts = 1;
}

message JMAPEmailStateRequest {
  repeated string object_digests = 1;
}

message JMAPEmailState {
  string object_digest = 1;
  string thread_id = 2;
  repeated string mailbox_ids = 3;
  repeated string keywords = 4;
  int64 state_sequence = 5;
  string received_at = 6;
}

message JMAPEmailStateResponse {
  repeated JMAPEmailState states = 1;
}

message JMAPEmailQueryRequest {
  string text = 1;
  string in_mailbox = 2;
  string has_keyword = 3;
  string not_keyword = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message JMAPEmailQueryResponse {
  repeated string ids = 1;
  int32 total = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message JMAPThreadRequest {
  repeated string ids = 1;
}

message JMAPThread {
  string id = 1;
  repeated string email_ids = 2;
}

message JMAPThreadResponse {
  repeated JMAPThread threads = 1;
}

message JMAPBlobLookupRequest {
  repeated string type_names = 1;
  repeated string blob_ids = 2;
}

message JMAPBlobReferences {
  string blob_id = 1;
  repeated string email_ids = 2;
  repeated string thread_ids = 3;
  repeated string mailbox_ids = 4;
}

message JMAPBlobLookupResponse {
  repeated JMAPBlobReferences blobs = 1;
}

message UpdateJMAPEmailStateRequest {
  string object_digest = 1;
  repeated string mailbox_ids = 2;
  repeated string keywords = 3;
}

message OperationProgressEvent {
  string at = 1;
  string stage = 2;
  string message = 3;
  double progress = 4;
  double total = 5;
}

message OperationRecord {
  string operation_id = 1;
  string request_hash = 2;
  string name = 3;
  bytes request_json = 4;
  string status = 5;
  repeated OperationProgressEvent progress = 6;
  bytes result_json = 7;
  string error = 8;
  string created_at = 9;
  string updated_at = 10;
  string completed_at = 11;
}

message CreateOperationRequest {
  string operation_id = 1;
  string request_hash = 2;
  string name = 3;
  bytes request_json = 4;
}

message CreateOrGetOperationResponse {
  OperationRecord operation = 1;
  bool created = 2;
}

message AppendOperationProgressRequest {
  string operation_id = 1;
  OperationProgressEvent event = 2;
}

message CompleteOperationRequest {
  string operation_id = 1;
  bytes result_json = 2;
}

message FailOperationRequest {
  string operation_id = 1;
  string message = 2;
}

message OperationLookupRequest { string operation_id = 1; }
message OperationByRequestHashRequest { string request_hash = 1; }

message OperationLookupResponse {
  OperationRecord operation = 1;
  bool found = 2;
}

message ProjectChangedRequest { string since = 1; }

message ValidateBearerTokenRequest { string token = 1; }

message ValidateBearerTokenResponse {
  bool valid = 1;
  string client_id = 2;
}
